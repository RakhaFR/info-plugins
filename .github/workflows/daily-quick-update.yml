# Quick Update — Tarik plugin baru dari halaman 1-5 forum (~2-3 menit)
# Trigger: Otomatis setiap hari pukul 09:00 UTC (16:00 WIB)

name: ⚡ Daily Quick Update

on:
  schedule:
    # Setiap hari 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  quick-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🌐 Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable" >> $GITHUB_ENV

      - name: ⚡ Run quick update scrape
        run: node scraper.js --update --pages 5
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

      - name: 📝 Commit & push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/plugins.json data/metadata.json data/progress.json
          if git diff --staged --quiet; then
            echo "No new plugins or updates found."
          else
            git commit -m "⚡ Daily quick update: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi